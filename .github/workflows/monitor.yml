name: Price glitch monitor

on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub's minimum; in practice runs start every ~5-15 min
  workflow_dispatch: {}      # "Run workflow" button for manual runs

# Never run two scans at once; a late one waits instead of overlapping.
concurrency:
  group: price-monitor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest   # has Google Chrome preinstalled
    timeout-minutes: 15
    env:
      NOTIFIER_MODE: ${{ secrets.NOTIFIER_MODE }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
      PINCODE: ${{ secrets.PINCODE }}
      CITY: ${{ secrets.CITY }}
      LATITUDE: ${{ secrets.LATITUDE }}
      LONGITUDE: ${{ secrets.LONGITUDE }}
      HEADLESS: "true"
      PYTHONWARNINGS: ignore
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # deals.db holds dedupe history, price history, baselines and cooldowns.
      # Each run restores the newest copy and saves a new one.
      - name: Restore database
        uses: actions/cache/restore@v4
        with:
          path: deals.db
          key: deals-db-${{ github.run_id }}
          restore-keys: deals-db-

      - name: Scan
        run: python run.py --once

      - name: Save database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: deals.db
          key: deals-db-${{ github.run_id }}

      - name: Upload log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: monitor-log
          path: logs/
          retention-days: 3
